apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-api
  namespace: settle
spec:
  replicas: 3
  selector:
    matchLabels: {app: settle-api}
  template:
    metadata:
      labels: {app: settle-api}
    spec:
      containers:
        - name: api
          image: paylane/settle-api:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: settle-config}
            - secretRef: {name: settle-secrets}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 1
          volumeMounts:
            - {name: logs, mountPath: /var/log/settle}
      volumes:
        - name: logs
          hostPath: {path: /var/log/settle}
---
apiVersion: v1
kind: Service
metadata:
  name: settle-api
  namespace: settle
spec:
  selector: {app: settle-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settle-api
  namespace: settle
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: settle-api}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
