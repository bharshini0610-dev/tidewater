apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: settle
  namespace: settle
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_504 non_idempotent"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: settle-api, port: {number: 80}}}
