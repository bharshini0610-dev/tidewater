# Dedicated identities with no Kubernetes API access (the pods never call the API server).
apiVersion: v1
kind: ServiceAccount
metadata: {name: settle-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: settle-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: settle-migrate}
automountServiceAccountToken: false
