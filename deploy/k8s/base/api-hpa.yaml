# maxReplicas is bounded by the DB connection budget in configmap.yaml, not by CPU.
# Raising it requires re-doing that arithmetic (or PgBouncer — docs/NOT-DONE.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settle-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: settle-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Pods, value: 1, periodSeconds: 60}]
