apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: settle}
    includeSelectors: false
resources:
  - serviceaccounts.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - ingress.yaml
  - worker-deployment.yaml
  - worker-pdb.yaml
# Images are pinned per environment (overlay) by the pipeline, by digest.
