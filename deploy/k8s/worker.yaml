apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-worker
  namespace: settle
spec:
  replicas: 2
  selector:
    matchLabels: {app: settle-worker}
  template:
    metadata:
      labels: {app: settle-worker}
    spec:
      containers:
        - name: worker
          image: paylane/settle-api:latest
          command: ["python", "-m", "settle.worker"]
          envFrom:
            - configMapRef: {name: settle-config}
            - secretRef: {name: settle-secrets}
          volumeMounts:
            - {name: logs, mountPath: /var/log/settle}
      volumes:
        - name: logs
          hostPath: {path: /var/log/settle}
