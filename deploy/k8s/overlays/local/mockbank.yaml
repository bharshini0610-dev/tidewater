apiVersion: v1
kind: Service
metadata: {name: mockbank, labels: {app: mockbank}}
spec:
  selector: {app: mockbank}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mockbank, labels: {app: mockbank}}
spec:
  replicas: 1
  selector: {matchLabels: {app: mockbank}}
  template:
    metadata: {labels: {app: mockbank}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mockbank
          image: settle-api
          command: ["uvicorn", "settle.mockbank:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
          env:
            - {name: BANK_FAIL_RATE, value: "0.05"}   # exercise the retry path
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /livez, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
