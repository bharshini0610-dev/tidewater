# Plain-nginx equivalent of deploy/k8s/base/ingress.yaml (for non-ingress-nginx setups).
#
# Fixed vs inherited:
#  * proxy_read_timeout 5s was shorter than /reports/daily (6-9 s)            -> 504s
#  * proxy_next_upstream ... non_idempotent re-sent POST /settlements to
#    another pod after a timeout                                               -> duplicate jobs
#  * upstream keepalive was not used; gunicorn keepalive (2s default) was
#    shorter than nginx's reuse window                                         -> sporadic 502s
#  * access log written to a file on the node                                   -> disk growth
#  * no request id, no body limit, version disclosure

map $http_x_request_id $req_id_out {
    default $http_x_request_id;
    ""      $request_id;
}

log_format settle_json escape=json
  '{"ts":"$time_iso8601","service":"nginx","request_id":"$req_id_out","remote":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"urt":"$upstream_response_time","upstream":"$upstream_addr"}';

limit_req_zone $binary_remote_addr zone=settle_writes:10m rate=20r/s;

upstream settle_api {
    server settle-api.settle.svc.cluster.local:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;          # < gunicorn keepalive (75s)
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout settle_json;
    error_log  /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id_out;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Request-ID $req_id_out always;
    add_header X-Content-Type-Options nosniff always;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Retry only when the connection could not be established; never re-send a request
    # that may already have been processed (POST is non-idempotent).
    proxy_next_upstream error;
    proxy_next_upstream_tries 2;

    location = /settlements {
        limit_req zone=settle_writes burst=40 nodelay;
        proxy_pass http://settle_api;
    }

    location / {
        proxy_pass http://settle_api;
    }

    location ~ ^/(metrics|healthz/deps)$ {
        deny all;                    # internal only; scraped in-cluster
    }
}
