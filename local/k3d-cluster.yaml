# k3d cluster for laptops and CI. Ingress is ingress-nginx (traefik disabled) reachable on
# http://localhost:8080. Kubelet rotates container logs (10Mi x 3 per container) and evicts
# on disk pressure before the node is full — a service logging in a loop can no longer
# fill the node disk.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: settle
servers: 1
agents: 1
image: rancher/k3s:v1.36.4-k3s1
ports:
  - port: 8080:80
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: ["server:*"]
      - arg: --kubelet-arg=container-log-max-size=10Mi
        nodeFilters: ["server:*", "agent:*"]
      - arg: --kubelet-arg=container-log-max-files=3
        nodeFilters: ["server:*", "agent:*"]
      - arg: --kubelet-arg=eviction-hard=nodefs.available<10%,imagefs.available<10%
        nodeFilters: ["server:*", "agent:*"]
