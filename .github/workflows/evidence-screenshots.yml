# Captures screenshots of finished `deliver` runs (public GitHub UI pages) for the
# submission evidence and stores them on the `evidence` branch.
name: evidence-screenshots

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Space-separated run ids of the deliver workflow
        required: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium >/dev/null
      - name: Screenshot run pages
        env:
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          mkdir -p ui
          cat > /tmp/shot.py <<'PY'
          import os, sys
          from playwright.sync_api import sync_playwright
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1500, "height": 1100}, device_scale_factor=1)
              pg.goto(f"{base}/actions/workflows/deploy.yml", wait_until="load")
              pg.wait_for_timeout(3000)
              pg.screenshot(path="ui/actions-runs-list.png")
              for rid in sys.argv[1:]:
                  pg.goto(f"{base}/actions/runs/{rid}", wait_until="load")
                  pg.wait_for_timeout(4000)
                  pg.screenshot(path=f"ui/run-{rid}-summary.png", full_page=True)
              b.close()
          PY
          python /tmp/shot.py $RUN_IDS
          ls -la ui
      - name: Commit to evidence branch
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add ui && git commit -qm "evidence: GitHub Actions UI screenshots" && git push -q origin HEAD:evidence
