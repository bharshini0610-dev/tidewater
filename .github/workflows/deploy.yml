# settle delivery pipeline — runs on GitHub-hosted runners (not `act`).
#
#   lint-test ─┐
#   terraform  │ (parallel, IaC gate)
#              └─ build (once, push, digest) ─ scan (trivy) ─ deploy+verify ─┬─ promote
#                                                                             └─ rollback (auto)
#
# "Local cluster": the deploy job creates a k3d cluster on the runner (same config as
# `make up`), seeds it with the current production release from
# deploy/releases/production.json, then deploys the candidate *by digest*.
#
# Secrets: none are committed or printed. The in-cluster DB password is generated per run
# and masked; the registry pull secret is the job's GITHUB_TOKEN (auto-masked by Actions).
name: deliver

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "deploy/releases/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release to build and deploy
        type: choice
        options: ["1.9.0", "1.9.1-rc"]
        default: "1.9.0"
      alert_demo:
        description: After a successful deploy, inject 3 s DB latency and show an alert firing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deliver-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE: ${{ inputs.release || '1.9.0' }}
  K3D_VERSION: v5.9.0
  KUSTOMIZE_VERSION: v5.8.1
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: settle
          POSTGRES_PASSWORD: ci-throwaway   # ephemeral service container, not a real credential
          POSTGRES_DB: settle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U settle" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Ruff (lint + format)
        working-directory: app
        run: ruff check . && ruff format --check .
      - name: Unit tests (incl. idempotency, SIGTERM drain, side-by-side schema)
        working-directory: app
        env:
          TEST_DATABASE_URL: postgresql+psycopg://settle:ci-throwaway@localhost:5432/settle
        run: python -m pytest -q --junitxml=../out/junit.xml
      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < app/Dockerfile
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -S warning scripts/*.sh infra/terraform/check.sh
      - name: Kubernetes manifests (kustomize build + kubeconform)
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin
          kustomize build deploy/k8s/overlays/local | kubeconform -strict -summary -kubernetes-version 1.30.0
      - name: Alert rules (promtool)
        run: |
          yq '.spec' observability/settle-rules.yaml > /tmp/rules.yaml
          docker run --rm -v /tmp/rules.yaml:/rules.yaml --entrypoint promtool prom/prometheus:v3.15.0 check rules /rules.yaml
      - name: Secret scan of the working tree (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --redact --no-banner -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit
          path: out/junit.xml

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install checkov==3.3.20
      - name: fmt -check, validate (staging + prod), tflint, checkov
        run: infra/terraform/check.sh | tee out-terraform.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: terraform-checks
          path: out-terraform.txt

  build:
    needs: [lint-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply release-candidate regression (reproduces the untrusted 1.9.1-rc image)
        if: env.RELEASE == '1.9.1-rc'
        run: git apply images/settle-api-1.9.1-rc/regression.patch
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built exactly once, exported as an OCI image layout. Its manifest digest is the
      # identity of the release: scan, deploy, rollback and promotion all use it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          build-args: |
            APP_VERSION=${{ env.RELEASE }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=oci,dest=/tmp/settle-api.oci.tar,name=settle-api:${{ env.RELEASE }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: digest
        run: |
          mkdir -p image/oci && tar -xf /tmp/settle-api.oci.tar -C image/oci
          digest=$(jq -r '.manifests[0].digest' image/oci/index.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > image/DIGEST && echo "$RELEASE" > image/VERSION
          {
            echo "### Build (once) — settle-api ${RELEASE}"
            echo "Every later stage uses exactly this digest; tags are never deployed."
            echo '```'
            echo "settle-api@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ env.RELEASE }}
          path: image/
          retention-days: 90

  scan:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.RELEASE }}
          path: image
      - name: Trivy — fail on fixable HIGH/CRITICAL vulnerabilities and embedded secrets
        run: |
          test "$(cat image/DIGEST)" = "${{ needs.build.outputs.digest }}"
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.74.0 image --input /w/image/oci \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /w/trivy.txt || { cat trivy.txt; exit 1; }
          cat trivy.txt
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.74.0 image --input /w/image/oci \
            --format cyclonedx --output /w/sbom.cdx.json
          { echo "### Image scan (trivy 0.74.0) — PASS for settle-api@$(cat image/DIGEST)"; echo '```'; tail -n 25 trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-and-sbom-${{ env.RELEASE }}
          path: |
            trivy.txt
            sbom.cdx.json

  deploy:
    needs: [build, scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write   # promote the production pointer + push evidence branch
      actions: read     # download the current production image artifact from its run
    env:
      REGISTRY: localhost:5050           # runner and nodes use the same reference (k3d mirror)
      CLUSTER_REGISTRY: localhost:5050
      IMAGE_REF: localhost:5050/settle-api@${{ needs.build.outputs.digest }}
      EVIDENCE: out/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.RELEASE }}
          path: image
      - name: Install k3d, kustomize, crane, playwright
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin crane
          curl -sSL "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" -o k3d && sudo install k3d /usr/local/bin/k3d && rm k3d
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin
          pip install pyyaml==6.0.3 playwright==1.63.0 && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p "$EVIDENCE"
      - name: Create local cluster (k3d) with its image registry
        run: |
          k3d cluster create --config local/k3d-cluster.yaml --wait --timeout 180s
          docker run -d --name settle-registry --network k3d-settle -p 5050:5000 registry:2
          for _ in $(seq 1 20); do curl -sf http://localhost:5050/v2/ >/dev/null && break; sleep 1; done
          pushed=$(crane push --insecure image/oci "$REGISTRY/settle-api:${RELEASE}")
          echo "pushed $pushed"
          [[ "$pushed" == *"@${{ needs.build.outputs.digest }}" ]] || { echo "digest changed in transit"; exit 1; }
      - name: Install platform (ingress-nginx, Prometheus, Alertmanager, Grafana)
        run: |
          scripts/install-platform.sh
          sed -i "s|RUNBOOK_BASE|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/RUNBOOK.md|" observability/settle-rules.yaml
          kubectl create ns settle --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k observability/

      - name: Seed cluster with current production release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f deploy/releases/production.json ]]; then
            prod_ver=$(jq -r .version deploy/releases/production.json)
            prod_digest=$(jq -r .digest deploy/releases/production.json)
            prod_run=$(jq -r .run_id deploy/releases/production.json)
            prod_ref="$CLUSTER_REGISTRY/settle-api@$prod_digest"
            if [[ "$prod_ref" != "$IMAGE_REF" ]]; then
              gh run download "$prod_run" -R "$GITHUB_REPOSITORY" -n "image-$prod_ver" -D prod-image
              pushed=$(crane push --insecure prod-image/oci "$REGISTRY/settle-api:prod-$prod_ver")
              [[ "$pushed" == *"@$prod_digest" ]] || { echo "production artifact digest mismatch"; exit 1; }
            fi
          fi
          if [[ -n "${prod_ref:-}" && "$prod_ref" != "$IMAGE_REF" ]]; then
            echo "### Current production: $prod_ver" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$prod_ref\`" >> "$GITHUB_STEP_SUMMARY"
            scripts/deploy.sh "$prod_ref" "$prod_ver"
            scripts/seed.sh
            SOAK_SECONDS=30 scripts/verify.sh "$prod_ver"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "version=$prod_ver" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy candidate ${{ env.RELEASE }} by digest (migrations first)
        run: |
          echo "### Deploy ${RELEASE}" >> "$GITHUB_STEP_SUMMARY"
          scripts/deploy.sh "$IMAGE_REF" "$RELEASE"
          scripts/seed.sh
          kubectl -n settle get pods -o wide | tee "$EVIDENCE/pods-after-deploy.txt"

      - name: Post-deploy verification
        id: verify
        continue-on-error: true
        run: scripts/verify.sh "$RELEASE" 2>&1 | tee "$EVIDENCE/verify-${RELEASE}.log"; exit "${PIPESTATUS[0]}"

      - name: Automatic rollback
        id: rollback
        if: steps.verify.outcome == 'failure'
        run: |
          python scripts/screenshots.py "before-rollback-${RELEASE}" "$EVIDENCE" || true
          if [[ "${{ steps.baseline.outputs.present }}" == "true" ]]; then
            scripts/rollback.sh 2>&1 | tee "$EVIDENCE/rollback.log"
            SOAK_SECONDS=30 scripts/verify.sh "${{ steps.baseline.outputs.version }}" 2>&1 | tee "$EVIDENCE/verify-after-rollback.log"
          else
            echo "No previous release to roll back to (first deploy); scaling candidate to 0." | tee "$EVIDENCE/rollback.log"
            kubectl -n settle scale deploy/settle-api deploy/settle-worker --replicas=0
          fi

      - name: Alert demo (chaos-db → SettleApiErrorBudgetBurn fires)
        if: steps.verify.outcome == 'success' && inputs.alert_demo
        env:
          SCREENSHOT_DIR: ${{ env.EVIDENCE }}
        run: scripts/alert-demo.sh 2>&1 | tee "$EVIDENCE/alert-demo.log"; cp /tmp/alerts-firing.json "$EVIDENCE/" || true

      - name: Collect evidence (state, events, correlated JSON logs, screenshots)
        if: always()
        run: |
          set +e
          kubectl -n settle get deploy,rs,pods,hpa,pdb,netpol -o wide > "$EVIDENCE/cluster-state.txt"
          kubectl -n settle rollout history deployment/settle-api > "$EVIDENCE/rollout-history.txt"
          kubectl -n settle get events --sort-by=.lastTimestamp > "$EVIDENCE/events.txt"
          kubectl -n settle logs -l app=settle-api --tail=400 --prefix > "$EVIDENCE/api-logs.jsonl"
          kubectl -n settle logs -l app=settle-worker --tail=400 --prefix > "$EVIDENCE/worker-logs.jsonl"
          rid=$(grep -ho '"request_id": "verify-post-1"' "$EVIDENCE"/*.jsonl | head -1)
          { echo "# One request followed across nginx -> API -> Redis -> worker -> bank (request_id=verify-post-1)"
            kubectl -n ingress-nginx logs deploy/ingress-nginx-controller --tail=2000 | grep verify-post-1 | head -3
            grep -h 'verify-post-1' "$EVIDENCE/api-logs.jsonl" "$EVIDENCE/worker-logs.jsonl" | head -8; } > "$EVIDENCE/request-correlation.txt"
          cp /tmp/verify-*.md "$EVIDENCE/" 2>/dev/null
          python scripts/screenshots.py "final-${RELEASE}" "$EVIDENCE"
          echo "found: $rid"
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ env.RELEASE }}
          path: out/evidence

      - name: Publish evidence to the `evidence` branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -e
          dest="runs/${GITHUB_RUN_NUMBER}-${RELEASE}-$([[ '${{ steps.verify.outcome }}' == success ]] && echo passed || echo rolled-back)"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git fetch origin evidence 2>/dev/null && git worktree add ev origin/evidence -B evidence || { git worktree add --orphan -b evidence ev; }
          mkdir -p "ev/$dest" && cp -r out/evidence/. "ev/$dest/"
          cd ev && git add -A && git commit -qm "evidence: run ${GITHUB_RUN_NUMBER} ${RELEASE} (${{ steps.verify.outcome }})" && git push -q origin evidence

      - name: Promote — record new production pointer
        if: steps.verify.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          jq -n --arg v "$RELEASE" --arg d "${{ needs.build.outputs.digest }}" \
                --arg r "$GITHUB_RUN_ID" --arg s "$GITHUB_SHA" \
                '{version:$v, image:"settle-api", digest:$d, run_id:$r, commit:$s, artifact:("image-"+$v)}' > deploy/releases/production.json
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add deploy/releases/production.json
          git commit -m "release: promote settle-api ${RELEASE} (${{ needs.build.outputs.digest }}) [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main
          echo "### Promoted ${RELEASE} to production pointer" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if the release was rejected
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error title=Release ${RELEASE} rejected::Post-deploy verification failed; rolled back automatically to ${{ steps.baseline.outputs.version || 'nothing (first deploy)' }}."
          exit 1
