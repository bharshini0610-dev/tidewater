# Lean kube-prometheus-stack for a laptop/CI cluster.
defaultRules: {create: false}      # only settle's 5 actionable alerts, no noise
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
nodeExporter: {enabled: false}
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 400Mi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
grafana:
  adminPassword: ""                # generated by the chart into a Secret; never committed
  sidecar:
    dashboards: {enabled: true, label: grafana_dashboard, searchNamespace: ALL}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
